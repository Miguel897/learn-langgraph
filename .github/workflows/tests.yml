name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked  # Python version comes from .python-version
      - name: Run fast tests (no LLM backend in CI)
        run: uv run pytest -m "not llm"
