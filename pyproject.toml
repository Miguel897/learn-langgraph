[project]
name = "learn-langgraph"
version = "0.1.0"
description = "Learning playground for LangGraph and LangChain (local Ollama or Anthropic)"
readme = "README.md"
authors = [
    { name = "Miguel897" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.0.4",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a reachable LLM backend (skipped otherwise)"]
